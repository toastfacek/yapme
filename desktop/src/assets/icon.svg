<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#FF6B35"/>

  <!-- Microphone icon -->
  <g transform="translate(256, 256)">
    <!-- Mic body -->
    <rect x="-40" y="-120" width="80" height="140" rx="40" fill="#FFF8F0"/>

    <!-- Mic stand -->
    <rect x="-6" y="20" width="12" height="60" fill="#FFF8F0"/>

    <!-- Mic base -->
    <ellipse cx="0" cy="80" rx="50" ry="15" fill="#FFF8F0"/>

    <!-- Sound waves -->
    <path d="M -100,-60 Q -120,-60 -120,-40 Q -120,-20 -100,-20"
          stroke="#F7931E" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 100,-60 Q 120,-60 120,-40 Q 120,-20 100,-20"
          stroke="#F7931E" stroke-width="8" fill="none" stroke-linecap="round"/>

    <path d="M -130,-80 Q -160,-80 -160,-40 Q -160,0 -130,0"
          stroke="#F7931E" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 130,-80 Q 160,-80 160,-40 Q 160,0 130,0"
          stroke="#F7931E" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
